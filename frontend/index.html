<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FoodStack</title>
    <script>
      // Apply the theme before React mounts to avoid a flash of the wrong theme.
      // Order: localStorage['foodstack-theme'] -> prefers-color-scheme -> light.
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('foodstack-theme') || 'system'
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
