<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hotel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">

    <!-- Flask static paths -->
    <link rel="stylesheet" href="/static/styles/login_styles.css">
    <script src="/static/js/globals.js"></script>
</head>

<body class="container">
    <div class="login-card">
        <div class="text-center">
            <img class="logo"
                 src="https://cdn-icons-png.flaticon.com/512/88/88973.png"
                 alt="stepPOSlogo"
                 width="250"
                 height="250">
            <h3 class="login-title">Log In</h3>
        </div>

        <div>
            <div class="form-container mb-3">
                <label class="form-label">Username:</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" class="form-control" id="txtUsername" placeholder="Username" required />
                </div>
            </div>

            <div class="form-container mb-3">
                <label class="form-label">Password:</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" class="form-control" id="txtPassword" placeholder="Password" required />
                </div>
            </div>

            <div class="form-container text-center mb-3">
                <button class="btn btn-login" onclick="login()">Log In</button>
            </div>

            <div class="mt-2 text-center">
                <small>You don't have an account? |
                    <a href="/signup">Sign Up</a>
                </small>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>sessionStorage.clear();</script>
    <script src="/static/js/login.js"></script>

    <!-- Sweetalert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
