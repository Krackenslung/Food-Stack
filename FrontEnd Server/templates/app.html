<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TJ Hotels | App</title>

  <!-- Maps JS API key injected by the server (FrontEnd Server/.env) -->
  <meta name="google-maps-api-key" content="{{ maps_api_key }}"/>
  <!-- Backend URL injected by the server (FrontEnd Server/.env) -->
  <meta name="api-base" content="{{ api_base }}"/>

  <!-- Favicon: SVG for modern browsers, PNG fallback -->
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg"/>
  <link rel="icon" type="image/png" href="/static/images/logo.png"/>
  <link rel="apple-touch-icon" href="/static/images/logo.png"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="static/styles/ui.css">
  <link rel="stylesheet" href="static/styles/app.css">
</head>

<body class="app-body">
<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar glass-card">
    <div class="side-brand">
      <img class="brand-logo-img small"
           src="static/images/logo.png"
           alt="TJ Hotels"/>
    </div>

    <nav class="side-nav">
      <button class="nav-item active" data-view="inicio">
        <i class="bi bi-house-door-fill"></i> Home
      </button>

      <button class="nav-item" data-view="hoteles">
        <i class="bi bi-building"></i> Hotels
      </button>

      <button class="nav-item" data-view="favoritos">
        <i class="bi bi-heart"></i> Favorites
      </button>

      <div class="nav-sep"></div>

      <button class="nav-item" data-view="soporte">
        <i class="bi bi-gear"></i> Support
      </button>
    </nav>
  </aside>

  <!-- Main -->
  <main class="content">

    <!-- Topbar -->
    <header class="topbar glass-card">
      <div class="search">
        <span class="icon"><i class="bi bi-search"></i></span>
        <input id="q" placeholder="Search hotels..." />
      </div>

      <div class="userbox">
        <button id="btnRegister" class="btn btn-light btn-sm">Register</button>
        <button id="btnLogin" class="btn btn-light btn-sm">Sign in</button>
      </div>
    </header>

    <!-- Filters -->
    <section class="filters glass-card" id="filtersBar">
      <div class="chip">
        <span><i class="bi bi-currency-dollar"></i></span>
        <select id="price">
          <option value="all">Price</option>
          <option value="0-100">$</option>
          <option value="100-200">$$</option>
          <option value="200-999">$$$</option>
        </select>
      </div>

      <div class="chip">
        <span><i class="bi bi-star-fill text-warning"></i></span>
        <select id="rating">
          <option value="all">Rating</option>
          <option value="4.5">4.5+</option>
          <option value="4.0">4.0+</option>
          <option value="3.5">3.5+</option>
        </select>
      </div>

      <div class="chip">
        <span><i class="bi bi-geo-alt-fill text-danger"></i></span>
        <select id="zone">
          <option value="all">Tijuana Zone</option>
          <option value="Zona Río">Zona Rio</option>
          <option value="Centro">Centro</option>
          <option value="Otay">Otay</option>
          <option value="Playas">Playas</option>
        </select>
      </div>
    </section>

    <!-- Views -->
    <section class="views">

      <!-- INICIO -->
      <section class="view active" id="view-inicio">

        <div class="glass-card p-0 overflow-hidden">
          <div class="hero">
            <img class="hero-img"
                 src="static/images/banner-tj-hotels.png"
                 alt="TJ Hotels banner" />

            <div class="hero-overlay">
              <div class="hero-title">Your next stay in Tijuana</div>
              <div class="hero-sub">
                Browse hotels by zone, rating and amenities.
                Pick one and we send you to the official site to book.
              </div>

              <div class="hero-ctas">
                <button class="btn btn-primary btn-sm" id="btnGoHotels">
                  Explore hotels
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- DESTACADOS -->
        <div class="glass-card p-3 mt-3">
          <div class="featured-title mb-3">Featured Hotels</div>
          <div class="text-muted small" id="featuredNote"></div>
          <div class="featured-carousel">
            <div class="carousel-track" id="featuredTrack">
              <div class="track-group" id="featuredGroup"></div>
              <div class="track-group" id="featuredGroupClone"></div>
            </div>
          </div>
        </div>

        <!-- REVIEWS -->
        <div class="glass-card p-3 mt-3">
          <div class="reviews-title mb-3">Recent Reviews</div>
          <div class="text-muted small" id="reviewsNote"></div>
          <div class="reviews-carousel">
            <div class="reviews-track" id="reviewsTrack">
              <div class="reviews-group" id="reviewsGroup"></div>
              <div class="reviews-group" id="reviewsGroupClone"></div>
            </div>
          </div>
        </div>

      </section>

      <!-- GRID (Hotels / Favorites) -->
      <section class="view" id="view-grid">
        <section class="grid">
          <div class="list glass-card">
            <div class="list-head">
              <div>
                <div class="fw-semibold" id="listTitle">Hotels</div>
                <div class="text-muted small" id="count"></div>
              </div>

              <div class="list-actions" id="hotelsActions" style="display:none;">
                <select id="radiusSel" class="form-select form-select-sm">
                  <option value="1000">1 km</option>
                  <option value="2000">2 km</option>
                  <option value="5000" selected>5 km</option>
                  <option value="10000">10 km</option>
                  <option value="20000">20 km</option>
                </select>

                <button class="btn btn-outline-primary btn-sm" id="btnGoFavs">
                  <i class="bi bi-star-fill"></i> Favorites
                </button>

                <button id="btnRefreshHotels" class="btn btn-outline-primary btn-sm">
                  <i class="bi bi-arrow-clockwise"></i> Reload
                </button>
              </div>
            </div>

            <div id="cards" class="cards"></div>
          </div>

          <div class="map glass-card">
            <div class="map-head">
              <div class="fw-semibold">Map</div>
            </div>

            <!-- El boton va FUERA de #map: Google Maps reemplaza el
                 contenido del contenedor al inicializarse y se lo llevaba
                 por delante, dejandolo sin listener. -->
            <div id="map" class="map-canvas"></div>

            <button id="btnRecenter" class="map-fab" aria-label="Recenter map">
              <i class="bi bi-crosshair"></i>
            </button>
          </div>
        </section>
      </section>

      <!-- SOPORTE -->
      <section class="view" id="view-soporte">
        <div class="glass-card p-3 support-wrap">
          <h5>Support</h5>
          <div class="text-muted small mb-3">
            FAQ and quick contact.
          </div>

          <div class="accordion accordion-flush mb-4" id="supportFaq">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed"
                        data-bs-toggle="collapse"
                        data-bs-target="#faq1">
                  How do bookings work?
                </button>
              </h2>
              <div id="faq1" class="accordion-collapse collapse"
                   data-bs-parent="#supportFaq">
                <div class="accordion-body">
                  Te redirigimos al sitio oficial del hotel para completar tu reserva.
                </div>
              </div>
            </div>
          </div>

          <form id="supportForm">
            <div class="mb-2">
              <input id="supportName" class="form-control" placeholder="Name">
            </div>
            <div class="mb-2">
              <input id="supportEmail" class="form-control" placeholder="Email">
            </div>
            <div class="mb-2">
              <select id="supportTopic" class="form-select">
                <option selected>General</option>
                <option>Bookings</option>
                <option>Account</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-2">
              <textarea id="supportMsg" class="form-control" rows="3"
                        placeholder="Message"></textarea>
            </div>
            <div class="text-danger small mb-2" id="supportHint"></div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-sm">Send</button>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSupportClear">Clear</button>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSupportEmail">Send by email</button>
            </div>
          </form>
        </div>
      </section>

    </section>
  </main>
</div>

<!-- Toast de soporte -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="supportToast" class="toast" role="alert" aria-live="polite" aria-atomic="true">
    <div class="toast-body" id="supportToastBody"></div>
  </div>
</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Global scripts (non-module: expose window.loadGoogleMapsOnce / window.FeaturedPlaces) -->
<script src="/static/js/maps-loader.js"></script>
<script src="/static/js/featured-places.js"></script>

<!-- Entry point (ES modules in /static/js/modules/) -->
<script type="module" src="/static/js/app.js"></script>

</body>
</html>
