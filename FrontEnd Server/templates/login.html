<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TJ Hotels | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles/ui.css">
  <link rel="stylesheet" href="/static/styles/auth.css">
</head>

<body class="bg-grid">
  <main class="auth-wrap">
    <div class="auth-stack">
      <div class="brand brand--auth">
        <img class="brand-logo-img" src="/static/images/logo.png" alt="TJ Hotels Logo" />
      </div>

      <section class="glass-card auth-card">
        <h5 class="mb-1">Sign In</h5>
        <p class="text-muted mb-4">Find hotels in Tijuana</p>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input id="email" class="form-control" placeholder="email@example.com" />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input id="password" type="password" class="form-control" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary w-100" id="btnLogin">Sign In</button>

        <div class="mt-3 text-center small">
          Don’t have an account? <a href="/register">Register</a>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/static/js/auth.js"></script>

</body>
</html>
