<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TJ Hotels | Register</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles/ui.css">
  <link rel="stylesheet" href="/static/styles/auth.css">
</head>

<body class="bg-grid">
  <main class="auth-wrap">
    <div class="auth-stack">
      <div class="brand brand--auth">
        <img class="brand-logo-img" src="/static/images/logo.png" alt="TJ Hotels" />
      </div>

      <section class="glass-card auth-card">
        <h5 class="mb-1">Create Account</h5>
        <p class="text-muted mb-4">Sign up to explore hotels in Tijuana</p>

        <div class="row g-3">
          
          <div class="col-md-6">
            <label class="form-label">First Name</label>
            <input id="name" type="text" class="form-control" placeholder="First Name" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <input id="lastName" type="text" class="form-control" placeholder="Last Name" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Date of Birth</label>
            <input id="dateOfBirth" type="date" class="form-control" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input id="phone" type="tel" class="form-control" placeholder="6641234567" required />
          </div>

          <div class="col-12">
            <label class="form-label">Email Address</label>
            <input id="email" type="email" class="form-control" placeholder="email@example.com" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" placeholder="••••••••" required />
          </div>

          <div class="col-md-6">
            <label class="form-label">Confirm Password</label>
            <input id="confirmPassword" type="password" class="form-control" placeholder="••••••••" required />
          </div>

        </div>

        <button class="btn btn-primary w-100 mt-4" id="btnRegister">
          Create Account
        </button>

        <div class="mt-3 text-center small">
          Already have an account? <a href="/">Sign in</a>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/js/auth.js"></script>
</body>
</html>
